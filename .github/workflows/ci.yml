name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  gradle-build:
    name: Gradle build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # sageactive4j-spring-boot3-starter compiles at --release 17 (Spring
        # Boot 3's own floor), so the full build needs JDK 17+. JDK 11 is
        # covered by the jdk11-build job below; the Java 8 *runtime* floor by
        # jdk8-runtime-smoke-test.
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test every module
        run: ./gradlew build --console=plain

  maven-build:
    name: Maven build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test every module
        run: mvn -B verify

  jdk11-build:
    name: JDK 11 build (all modules except the Spring Boot 3 starter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven
      - uses: gradle/actions/setup-gradle@v4
      - name: Gradle
        run: >
          ./gradlew --console=plain
          :sageactive4j-core:build :sageactive4j-servlet:build :sageactive4j-jakarta:build
          :sageactive4j-spring-boot2-starter:build
      - name: Maven
        run: mvn -B verify -pl '!sageactive4j-spring-boot3-starter'

  jdk8-runtime-smoke-test:
    name: Java 8 runtime smoke test
    runs-on: ubuntu-latest
    needs: gradle-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the jar (release 8 bytecode)
        run: ./gradlew :sageactive4j-core:jar --console=plain
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Make a real GraphQL call on a real Java 8 JVM
        # Java 8 ignores META-INF/versions entirely, so this proves the base
        # (HttpURLConnection) entries work on their own, end to end.
        run: |
          java -version 2>&1 | grep -q '"1\.8' || { echo "Expected a Java 8 JVM" >&2; exit 1; }
          JAR=$(find sageactive4j-core/build/libs -name 'sageactive4j-core-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          mkdir -p /tmp/smoke
          javac -cp "$JAR" -d /tmp/smoke ci/smoke/Smoke.java
          java -cp "$JAR:/tmp/smoke" Smoke HttpURLConnection

  mrjar-smoke-test:
    name: Multi-release jar smoke test (JPMS)
    runs-on: ubuntu-latest
    needs: gradle-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the multi-release jar
        run: ./gradlew :sageactive4j-core:jar --console=plain
      - name: Validate multi-release consistency
        run: |
          JAR=$(find sageactive4j-core/build/libs -name 'sageactive4j-core-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          jar --validate --file "$JAR"
      - name: Describe both module descriptors
        run: |
          JAR=$(find sageactive4j-core/build/libs -name 'sageactive4j-core-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          jar --file="$JAR" --describe-module --release 9 | tee /tmp/module-9.txt
          jar --file="$JAR" --describe-module --release 11 | tee /tmp/module-11.txt
          for pkg in "" .auth .exception .graphql .input .model .service; do
            grep -q "^exports io.github.josemodi97.sageactive4j${pkg}$" /tmp/module-9.txt
            grep -q "^exports io.github.josemodi97.sageactive4j${pkg}$" /tmp/module-11.txt
          done
          grep -q "^requires java.net.http" /tmp/module-11.txt
          if grep -q "^requires java.net.http" /tmp/module-9.txt; then
            echo "Java 9 descriptor must not require java.net.http" >&2
            exit 1
          fi
          # .internal must stay encapsulated:
          if grep -q "^exports .*internal" /tmp/module-9.txt /tmp/module-11.txt; then
            echo "internal package leaked into a module descriptor" >&2
            exit 1
          fi
      - name: Make a real GraphQL call through the module path
        # On the module path a missing `requires java.net.http` only fails at
        # run time (IllegalAccessError), so this has to actually send a request.
        run: |
          JAR=$(find sageactive4j-core/build/libs -name 'sageactive4j-core-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          mkdir -p /tmp/module-smoke
          javac -cp "$JAR" -d /tmp/module-smoke ci/smoke/Smoke.java ci/smoke/ModuleSmoke.java
          java --module-path "$JAR" --add-modules io.github.josemodi97.sageactive4j.core -cp /tmp/module-smoke ModuleSmoke
      - name: Confirm the HttpClient variant is selected on Java 11+ (classpath)
        run: |
          JAR=$(find sageactive4j-core/build/libs -name 'sageactive4j-core-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          java -cp "$JAR:/tmp/module-smoke" Smoke HttpClient
